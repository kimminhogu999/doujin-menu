name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build_win
            cmd: build:win
          - name: build_port_win
            cmd: build:port:win

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm run ${{ matrix.cmd }}

      - name: Debug build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "Root files:"
          Get-ChildItem -Force

          Write-Host "Checking dist directory:"
          if (Test-Path "dist") {
            Get-ChildItem "dist" -Force -Recurse
          } else {
            Write-Host "dist directory does not exist"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/build_win/doujin-menu-setup-*.exe
            artifacts/build_win/*.blockmap
            artifacts/build_win/latest.yml
            artifacts/build_port_win/doujin-menu-portable-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
