name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows (${{ matrix.name }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build_win
            cmd: build:win
          - name: build_port_win
            cmd: build:port:win

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm run ${{ matrix.cmd }}

      - name: Debug build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Current directory ==="
          Get-Location

          Write-Host "=== Root directory ==="
          Get-ChildItem -Force

          Write-Host "=== Find EXE and build output files ==="
          Get-ChildItem . -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @(".exe", ".blockmap", ".yml") -or
              $_.FullName -match '[\\/](dist|release|out|build)[\\/]'
            } |
            Select-Object -ExpandProperty FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: |
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Show downloaded artifacts
        run: |
          echo "Downloaded files:"
          find artifacts -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            artifacts/build_win/**/*.exe
            artifacts/build_win/**/*.blockmap
            artifacts/build_win/**/*.yml
            artifacts/build_port_win/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
